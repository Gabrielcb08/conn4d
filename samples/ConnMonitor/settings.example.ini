; ============================================================================
; Conn4D - ConnMonitor : EXEMPLO (self-contained). ESTE arquivo SOBE no git.
; Copie para "settings.ini" (na mesma pasta) e ajuste para a sua base REAL.
; O settings.ini NAO e versionado (.gitignore) - guarda credenciais locais.
;
; Default = SQLite: roda sem servidor. Se Database ficar vazio, o app cria
; "produtos_demo.sqlite" ao lado do executavel e semeia a tabela PRODUTOS.
;
; Para Firebird/Postgres/etc., troque [Connection] (ver bloco comentado abaixo).
; ============================================================================

[Connection]
Provider=SQLite
Database=
ConnectTimeout=5000

; Client library nativa por plataforma (ex.: fbclient.dll, libpq.dll).
; Pode ser uma PASTA ou o caminho completo de um .dll. Se vazio, o app assume
; o default: <pasta do exe>\dlls\x86  (Win32)  ou  <pasta do exe>\dlls\x64 (Win64).
VendorLibX86=
VendorLibX64=

; --- Exemplo Firebird (descomente e ajuste) ---------------------------------
; Provider=Firebird
; Host=127.0.0.1
; Port=3050
; Database=C:\caminho\para\MEUBANCO.FDB
; UserName=SYSDBA
; Password=masterkey
; Coloque fbclient.dll em build\dlls\x86 (Win32) e deixe VendorLibX86 vazio,
; ou aponte VendorLibX86=C:\Firebird\fbclient.dll diretamente.

[Pool]
MinSize=1
MaxSize=5
AcquireTimeout=3000
; MaxLeaseTime curto para a demo de zumbi ser visivel em segundos.
MaxLeaseTime=8000
IdleTimeout=20000

[GC]
Enabled=1
; GC acorda a cada 2s e fecha conexoes zumbi/idle automaticamente.
Interval=2000
